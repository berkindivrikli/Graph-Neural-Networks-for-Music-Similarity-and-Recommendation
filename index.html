<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendation with GCN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Recommendation with GCN</h1>
        <p class="subtitle">Find musically similar tracks using GCN embeddings</p>
        
        <div class="search-container">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search for a song by title or artist..."
                    autocomplete="off"
                >
                <button id="searchButton">Search</button>
            </div>
            <div id="suggestions" class="suggestions"></div>
        </div>
        
        <div id="selectedTrack" class="selected-track" style="display: none;"></div>
        
        <div id="results" class="results"></div>
        
        <div id="loading" class="loading" style="display: none;">Loading recommendations...</div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
